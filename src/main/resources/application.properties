spring.application.name=booking

# ===== MySQL datasource =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flight_booking?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool (tuned so booking retries have room under contention)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
# tighter lock wait so contended bookings fail fast and the retry loop can re-attempt
spring.jpa.properties.jakarta.persistence.lock.timeout=3000

# Sample data is inserted programmatically by DataSeeder on first boot (empty DB only).
spring.sql.init.mode=never

# ===== JWT =====
# Base64-encoded 256-bit secret. Override in prod via APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:5a6f6e6b65792d666c696768742d626f6f6b696e672d7365637265742d6b6579}
app.jwt.expiration-ms=${APP_JWT_EXP_MS:86400000}

# ===== Search itinerary cache / precompute =====
# Full cache rebuild interval (hourly refresh requirement) in ms
app.cache.refresh-interval-ms=${CACHE_REFRESH_MS:3600000}
# Connecting-flight rules
app.itinerary.max-legs=3
app.itinerary.min-connection-minutes=45
app.itinerary.max-layover-minutes=360

# ===== Booking retry (double-booking safe) =====
app.booking.max-retries=3
app.booking.retry-backoff-ms=50

logging.level.com.flight.booking=INFO
