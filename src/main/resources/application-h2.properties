# Run with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# File-based H2 (MySQL compatibility mode) — data PERSISTS across restarts in ./data/.
# No external DB needed. DataSeeder runs once (only when the DB is empty).
spring.datasource.url=jdbc:h2:file:./data/flight_booking;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Browse the data at http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:file:./data/flight_booking;MODE=MySQL;AUTO_SERVER=TRUE
#   User: sa   Password: (blank)
spring.h2.console.enabled=true
