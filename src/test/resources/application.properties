# Test profile uses in-memory H2 (MySQL compatibility mode) so the context loads without a real DB.
spring.datasource.url=jdbc:h2:mem:flight_booking;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# enough connections for the concurrency test's threads
spring.datasource.hikari.maximum-pool-size=24
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

app.jwt.secret=5a6f6e6b65792d666c696768742d626f6f6b696e672d7365637265742d6b6579
app.jwt.expiration-ms=86400000
app.cache.refresh-interval-ms=3600000
app.itinerary.max-legs=3
app.itinerary.min-connection-minutes=45
app.itinerary.max-layover-minutes=360
app.booking.max-retries=3
app.booking.retry-backoff-ms=50
